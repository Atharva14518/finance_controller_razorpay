# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: razorpay-recon-agent
    runtime: python
    buildCommand: ./build.sh
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GROQ_API_KEY
        sync: false          # prompt user to fill in Render dashboard
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
